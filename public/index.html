<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amrjeet Gaming</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="auth-screen" class="screen active-screen">
        <div class="auth-box">
            <h2 id="form-title">Login</h2>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            
            <div id="signup-fields" style="display:none;">
                <input type="text" id="username" placeholder="Your Name">
                <input type="text" id="referral" placeholder="Referral Code (Optional)">
                <p style="font-size:10px; color:#aaa; margin:0;">Enter friend's code for +50 Bonus!</p>
            </div>

            <button class="btn-primary" onclick="handleAuth()" id="auth-btn">Login</button>
            <button class="switch-btn" onclick="toggleAuthMode()" id="switch-text">New here? Create Account</button>
            <p id="error-msg"></p>
        </div>
    </div>

    <div id="app-screen" class="screen">
        <header>
            <div class="logo">AMRJEET GAMING</div>
            <div class="wallet-badge">
                🪙 <span id="coin-balance">...</span>
            </div>
        </header>

        <div class="app-content">
            <h3 id="welcome-text">Welcome!</h3>

            <div style="background: linear-gradient(45deg, #ff8f00, #ff6f00); padding: 15px; border-radius: 12px; margin-bottom: 20px; color: black; box-shadow: 0 4px 10px rgba(255, 111, 0, 0.3);">
                <div style="font-weight: bold; font-size: 14px;">🤝 Refer & Earn</div>
                <div style="font-size: 12px; margin-bottom: 5px;">Share code, get 50 coins each!</div>
                <div style="background: rgba(0,0,0,0.1); padding: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center;">
                    <span id="my-referral-code" style="font-family: monospace; font-weight: bold; font-size: 16px;">LOADING...</span>
                    <button onclick="copyCode()" style="border:none; background: black; color: white; padding: 5px 10px; border-radius: 5px; font-size: 10px;">COPY</button>
                </div>
            </div>
            
            <div class="game-card">
                <div class="game-icon">🐍</div>
                <div class="game-info">
                    <div class="game-title">Snake Master</div>
                    <div class="game-desc">Earn 10 Coins/Win</div>
                </div>
                <a href="snake.html" class="play-btn" style="text-decoration:none;">PLAY</a>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active">🏠 Home</div>
            <div class="nav-item">🏆 Rank</div>
            <div class="nav-item" onclick="logoutUser()">🚪 Logout</div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    
    <script>
        function copyCode() {
            const code = document.getElementById("my-referral-code").innerText;
            navigator.clipboard.writeText(code);
            alert("Code Copied: " + code);
        }
    </script>

</body>
</html>
